<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BloqueaSitios</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="title">BloqueaSitios</div>
      <div id="status" class="status">Loading…</div>
      <div id="detail" class="detail"></div>

      <div class="actions">
        <button id="syncNow" class="btn">Sync calendar</button>
        <a class="btn secondary" href="#" id="openOptions">Settings</a>
      </div>

      <div class="unlock-section-label">x.com time</div>
      <div class="unlock-form">
        <div class="form-label">12 min per period (to noon · noon–8pm · 8pm–midnight), counted automatically</div>
        <div id="xStatus" class="x-status">Loading…</div>
      </div>

      <!-- Log section -->
      <div class="log-actions">
        <button id="toggleLog" class="btn-link">View unlock history</button>
      </div>
      <div id="logSection" class="log-section hidden">
        <div id="logEntries" class="log-entries"></div>
        <div class="log-buttons">
          <button id="downloadLog" class="btn btn-small">Download CSV</button>
          <button id="clearLog" class="btn btn-small secondary">Clear log</button>
        </div>
      </div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
